[project]
name = "personal-agent"
version = "0.1.0"
description = "Incrementally built personal agent API"
requires-python = ">=3.12,<3.15"
dependencies = [
    "google-genai>=1,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic-settings>=2.6,<3",
    "structlog>=24,<27",
    "langfuse>=4.16.0",
    "langgraph>=1.2.14",
    "sqlalchemy[asyncio]>=2.1.4",
    "psycopg[binary,pool]>=3.3.6",
    "alembic>=1.20.0",
    "langgraph-checkpoint-postgres>=3.1.2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I"]
