[project]
name = "personal-agent"
version = "0.1.0"
description = "Incrementally built personal agent API"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic-settings>=2.6,<3",
    "structlog>=24,<27",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I"]
